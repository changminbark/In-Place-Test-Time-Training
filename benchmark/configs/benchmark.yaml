benchmark_name: long_context_retrieval_mini
full_eval: false

tokenizer_model_id: google/gemma-3-1b-it

tasks:
  - vt
  - cwe
  - fwe
  - helmet_trec_coarse
  - helmet_banking77
  - helmet_nq
  - helmet_hotpotqa

context_lengths:
  - 1024
  - 4096
  - 8192
  - 16384
  - 32768

profiles:
  dev:
    examples_per_task_length: 25
  full:
    examples_per_task_length: 100

modes:
  - in_context
  - ttt_paper
  - ttt_strict

needle_positions:
  - early
  - middle
  - late

generation:
  max_new_tokens: 16  # default for tasks not listed below
  temperature: 0.0
  do_sample: false
  max_new_tokens_per_task:
    # RULER tasks
    vt: 30
    cwe: 120
    fwe: 50
    # HELMET RAG (short factoid answers)
    helmet_nq: 20
    helmet_hotpotqa: 20
    helmet_triviaqa: 20
    helmet_popqa: 20
    # HELMET ICL (single class label)
    helmet_trec_coarse: 16
    helmet_trec_fine: 16
    helmet_banking77: 16
    helmet_clinic150: 16
    helmet_nlu: 16

scoring:
  normalize_case: true
  strip_whitespace: true
  strip_punctuation: true

seed: 1337
